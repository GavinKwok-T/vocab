<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>雅思词汇本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans:wght@400&display=swap">
<link rel="stylesheet" href="app.css?v=e9bfffe">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="导航">
    <div class="brand">雅思词汇本</div>
    <nav class="nav" id="tabs" role="tablist" aria-label="栏目"></nav>
  </aside>
  <div class="main-col">
    <header class="top">
      <h1 id="title">雅思词汇本</h1>
      <div class="top-acts">
        <button class="acc" id="acc-btn" type="button" aria-label="切换英音、美音"><span id="acc-us">美</span><span id="acc-gb">英</span></button>
        <button class="ib" id="q-open" type="button" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></button>
        <button class="ib" type="button" data-help="guide" aria-label="使用说明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.4c-.8.4-1.2 1-1.2 1.8"/><path d="M12 17h.01"/></svg></button>
        <button class="sync" id="sync-btn" type="button" data-k="off" aria-label="同步和设置"><span class="dot" aria-hidden="true"></span><span id="sync-txt">未连接</span></button>
      </div>
    </header>
    <div class="search" id="search" role="search" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="搜单词或中文意思" aria-label="搜索单词" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clr" id="q-clear" type="button" aria-label="关闭搜索">×</button>
    </div>
    <div class="stick-mark" id="stick-mark"></div>
    <div class="tools" id="tools" hidden>
      <div class="seg" role="group" aria-label="遮住自测">
        <button id="m-all" aria-pressed="true" aria-label="全部显示">全部</button>
        <button id="m-zh" aria-pressed="false" aria-label="遮住中文">遮中文</button>
        <button id="m-en" aria-pressed="false" aria-label="遮住英文">遮英文</button>
      </div>
      <button class="pill" id="d-toggle" type="button" aria-pressed="false">展开详情</button>
    </div>
    <main id="view"><div class="empty"><strong>正在打开</strong>稍等一下。</div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="栏目"></nav>
</div>
<div class="pop" id="pop" role="dialog" aria-label="单词释义" hidden></div>
<button class="totop" id="totop" type="button" aria-label="回到顶部" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
<dialog class="dlg" id="dlg" aria-labelledby="dlg-h">
  <div class="dlg-in" id="dlg-in"></div>
  <div class="dlg-in dlg-voice" id="dlg-voice" hidden>
    <div class="prow"><span class="plab">发音</span>
      <div class="seg" role="group" aria-label="发音">
        <button id="v-us" aria-pressed="true">美音</button>
        <button id="v-gb" aria-pressed="false">英音</button>
        <button id="r-slow" aria-pressed="false">慢速</button>
      </div>
    </div>
  </div>
</dialog>
<dialog class="dlg" id="cap-dlg" aria-labelledby="cap-h">
  <div class="dlg-in">
    <div class="dlg-h"><h2 id="cap-h">记一条</h2><button type="button" class="clr" data-close="1" aria-label="关闭">×</button></div>
    <form class="cap" id="cap" autocomplete="off">
      <div class="cap-editing" id="cap-editing" role="status" hidden><span>正在修改这条笔记</span><button type="button" class="pill" id="cap-cancel">取消修改</button></div>
      <input id="cap-text" maxlength="200" placeholder="听到的词或句子" aria-label="听到的词或句子" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <input id="cap-note" maxlength="300" placeholder="备注（可选）：老师的解释、用法" aria-label="备注" enterkeyhint="done">
      <div class="row" role="group" aria-label="哪节课" id="cap-cls"></div>
      <div class="row"><button type="button" class="pill star" id="cap-star" aria-pressed="false">★ 想用</button><button type="submit" class="go" id="cap-go">记下</button></div>
    </form>
  </div>
</dialog>
<script src="config.js?v=e9bfffe"></script>
<script src="store.js?v=e9bfffe"></script>
<script src="app.js?v=e9bfffe"></script>
</body>
</html>
